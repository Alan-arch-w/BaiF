<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-title-key="page.articles.title">Articles</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("site-theme") || "dark";
          const lang = localStorage.getItem("site-language") || "en";
          document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.lang = "en";
        }
      })();
    </script>
    <script src="./assets/vendor/tailwindcss.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./site.css?v=20260813-1" />
    <script src="./site-cursor.js?v=20260812-1" defer></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Playfair Display", "serif"],
            },
            colors: {
              "zinc-950": "#09090b",
            },
            animation: {
              "fade-in-up": "fadeInUp 0.8s ease-out forwards",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="antialiased">
    <header class="site-header fixed top-0 left-0 w-full z-50 px-6 py-6 md:px-12 md:py-8 flex justify-between items-center mix-blend-difference text-white">
      <a href="./index.html" class="site-brand" aria-label="Alan Wang — Home">
        <svg class="site-brand__mark" viewBox="0 0 44 44" aria-hidden="true"><path d="M22 3 38.5 12.5v19L22 41 5.5 31.5v-19L22 3Z"/><path d="m5.5 12.5 16.5 9.5 16.5-9.5M22 22v19"/><path d="m13.8 29.2 8.2-14.3 8.2 14.3M17.4 23h9.2"/></svg>
        <span class="site-brand__wordmark">ALAN WANG</span>
      </a>
      <nav class="hidden md:flex space-x-8 text-sm font-light tracking-wide">
        <a href="./projects.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.projects">Projects</a>
        <a href="./portfolio.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.portfolio">Portfolio</a>
        <a href="./articles.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.articles">Articles</a>
      </nav>
    </header>

    <main class="pt-28">
      <section class="w-full py-20 px-6 md:px-12 bg-black">
        <div class="max-w-screen-xl mx-auto">
          <div class="flex items-end justify-between gap-8 mb-14">
            <div>
              <h1 class="text-4xl md:text-6xl font-semibold tracking-tighter leading-none" data-i18n="page.articles.heading">Articles</h1>
            </div>
          </div>

          <div id="post-list" class="flex flex-col"></div>
        </div>
      </section>
    </main>

    <script src="./data/local-content.js"></script>
    <script type="module">
      import {
        applyTranslations,
        escapeHtml,
        getLocalizedValue,
        isPreviewMode,
        loadJson,
        renderTags,
        setupGlobalControls,
        syncPreviewLinks,
        t,
        withPreviewParams,
      } from "./site.js?v=20260812-1";

      const pageTranslations = {
        "page.articles.title": { en: "Articles", zh: "文章" },
        "page.articles.heading": { en: "Articles", zh: "文章" }
      };

      const listEl = document.getElementById("post-list");
      let postsCache = [];

      function renderRow(post) {
        const title = escapeHtml(getLocalizedValue(post, "title"));
        const summary = escapeHtml(getLocalizedValue(post, "summary"));
        const date = escapeHtml(post.date || "");
        const tags = renderTags(post.tags || []);
        const statusBadge =
          isPreviewMode() && (post.status || "published") !== "published"
            ? `<span class="inline-flex items-center rounded-full border border-white/10 px-2 py-1 text-[10px] uppercase tracking-widest text-zinc-500">Draft</span>`
            : "";
        return `
          <a href="${withPreviewParams(`./post.html?slug=${encodeURIComponent(post.slug)}`)}" class="group py-10 border-b border-white/10 transition-colors hover:bg-white/5 px-4 -mx-4">
            <div class="flex items-start justify-between gap-6">
              <div class="flex-1">
                <div class="flex flex-wrap items-center gap-3">
                  <h3 class="text-2xl md:text-3xl font-medium tracking-tight group-hover:translate-x-1 transition-transform duration-500">${title}</h3>
                  ${statusBadge}
                </div>
                <p class="text-zinc-400 text-sm md:text-base font-light leading-relaxed mt-3 max-w-2xl">${summary}</p>
                <div class="flex flex-wrap gap-2 mt-6">${tags}</div>
              </div>
              <div class="text-xs font-mono text-zinc-600 whitespace-nowrap">${date}</div>
            </div>
          </a>
        `;
      }

      function renderPage() {
        applyTranslations(pageTranslations);
        const visiblePosts = isPreviewMode()
          ? postsCache
          : postsCache.filter((post) => (post.status || "published") === "published");
        listEl.innerHTML = visiblePosts.map(renderRow).join("");
        syncPreviewLinks(listEl);
      }

      async function init() {
        try {
          postsCache = await loadJson("./data/posts.json");
          renderPage();
        } catch {
          listEl.innerHTML = `<div class="text-zinc-500 text-sm">${t("common.failedPosts", pageTranslations)}</div>`;
        }
      }

      setupGlobalControls();
      init();
      window.addEventListener("site:language-change", renderPage);
    </script>
  </body>
</html>
