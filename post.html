<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-title-key="page.post.title">Post</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("site-theme") || "dark";
          const lang = localStorage.getItem("site-language") || "en";
          document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.lang = "en";
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./site.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Playfair Display", "serif"],
            },
            colors: {
              "zinc-950": "#09090b",
            },
            animation: {
              "fade-in-up": "fadeInUp 0.8s ease-out forwards",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      .prose-invert h1,
      .prose-invert h2,
      .prose-invert h3,
      .prose-invert p,
      .prose-invert li,
      .prose-invert a,
      .prose-invert code {
        color: inherit;
      }
      .prose-invert a {
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .prose-invert code {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 0.1rem 0.35rem;
        border-radius: 0.25rem;
      }
    </style>
  </head>
  <body class="antialiased">
    <header class="site-header fixed top-0 left-0 w-full z-50 px-6 py-6 md:px-12 md:py-8 flex justify-between items-center mix-blend-difference text-white">
      <a href="./index.html" class="text-sm font-medium tracking-[0.2em] uppercase hover:opacity-70 transition-opacity" data-i18n="brand.name">Alan Wang</a>
      <nav class="hidden md:flex space-x-8 text-sm font-light tracking-wide">
        <a href="./projects.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.projects">Projects</a>
        <a href="./portfolio.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.portfolio">Portfolio</a>
        <a href="./articles.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.articles">Articles</a>
      </nav>
    </header>

    <main class="pt-28">
      <section class="w-full py-20 px-6 md:px-12 bg-black">
        <div class="max-w-3xl mx-auto">
          <a href="./articles.html" class="text-xs uppercase tracking-widest text-zinc-500 hover:text-white transition-colors" data-i18n="page.post.back">
            ← Back to Articles
          </a>

          <div class="mt-10 flex items-start justify-between gap-6">
            <div>
              <h1 id="post-title" class="text-4xl md:text-7xl font-semibold tracking-tighter leading-[0.95]"></h1>
              <p id="post-summary" class="text-zinc-400 text-base md:text-lg font-light leading-relaxed mt-8"></p>
              <div id="post-tags" class="flex flex-wrap gap-2 mt-8"></div>
            </div>
            <div id="post-date" class="text-xs font-mono text-zinc-600"></div>
          </div>

          <article id="post-content" class="mt-16 border-t border-white/10 pt-12 prose-invert"></article>
        </div>
      </section>
    </main>

    <script type="module">
      import { applyTranslations, getLocalizedValue, getQueryParam, loadJson, renderTags, setupGlobalControls, t } from "./site.js";

      const pageTranslations = {
        "page.post.title": { en: "Article", zh: "文章详情" },
        "page.post.back": { en: "← Back to Articles", zh: "← 返回文章列表" }
      };

      const slug = getQueryParam("slug");
      const titleEl = document.getElementById("post-title");
      const summaryEl = document.getElementById("post-summary");
      const tagsEl = document.getElementById("post-tags");
      const dateEl = document.getElementById("post-date");
      const contentEl = document.getElementById("post-content");
      let postCache = null;

      function setNotFound() {
        applyTranslations(pageTranslations);
        titleEl.textContent = t("common.postNotFound", pageTranslations);
        summaryEl.textContent = t("common.invalidPostSlug", pageTranslations);
        tagsEl.innerHTML = "";
        dateEl.textContent = "";
        contentEl.innerHTML = "";
      }

      function renderPage() {
        if (!postCache) return setNotFound();
        applyTranslations(pageTranslations);
        const title = getLocalizedValue(postCache, "title");
        document.title = `${title} · ${t("page.post.title", pageTranslations)}`;
        titleEl.textContent = title;
        summaryEl.textContent = getLocalizedValue(postCache, "summary");
        dateEl.textContent = postCache.date || "";
        tagsEl.innerHTML = renderTags(postCache.tags || []);
        const markdown = getLocalizedValue(postCache, "contentMd");
        if (markdown && window.marked?.parse) {
          contentEl.innerHTML = window.marked.parse(markdown, { breaks: true, gfm: true });
        } else if (markdown) {
          contentEl.innerHTML = `<pre>${markdown}</pre>`;
        } else {
          contentEl.innerHTML = getLocalizedValue(postCache, "contentHtml");
        }
      }

      async function init() {
        if (!slug) return setNotFound();
        try {
          const posts = await loadJson("./data/posts.json");
          postCache = posts.find((post) => post.slug === slug) || null;
          if (!postCache) return setNotFound();
          renderPage();
        } catch {
          setNotFound();
        }
      }

      setupGlobalControls();
      init();
      window.addEventListener("site:language-change", renderPage);
    </script>
  </body>
</html>
