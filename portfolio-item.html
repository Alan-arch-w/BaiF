<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-title-key="page.portfolioItem.title">Portfolio Item</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("site-theme") || "dark";
          const lang = localStorage.getItem("site-language") || "en";
          document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.lang = "en";
        }
      })();
    </script>
    <script src="./assets/vendor/tailwindcss.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./site.css?v=20260814-3" />
    <script src="./site-cursor.js?v=20260812-1" defer></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Playfair Display", "serif"],
            },
            colors: {
              "zinc-950": "#09090b",
            },
            animation: {
              "fade-in-up": "fadeInUp 0.8s ease-out forwards",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="antialiased">
    <header class="site-header fixed top-0 left-0 w-full z-50 px-6 py-6 md:px-12 md:py-8 flex justify-between items-center mix-blend-difference text-white">
      <a href="./index.html" class="site-brand" aria-label="DONGYE Home">
        <svg class="site-brand__mark" viewBox="0 0 44 44" aria-hidden="true"><path d="M9 7.5c7.5-1 18.8-1 26 0 1.8.3 2.8 1.4 3 3.1.8 7.7.8 15.2 0 22.8-.2 1.7-1.2 2.8-3 3.1-7.4 1-18.6 1-26 0-1.8-.3-2.8-1.4-3-3.1-.8-7.6-.8-15.1 0-22.8.2-1.7 1.2-2.8 3-3.1Z"/><circle cx="18.2" cy="22" r="1.15" fill="currentColor" stroke="none"/><circle cx="25.8" cy="22" r="1.15" fill="currentColor" stroke="none"/></svg>
        <span class="site-brand__wordmark">DONGYE</span>
      </a>
      <nav class="hidden md:flex space-x-8 text-sm font-light tracking-wide">
        <a href="./projects.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.projects">Projects</a>
        <a href="./portfolio.html?view=photography" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.photography">Photography</a>
        <a href="./portfolio.html?view=portfolio" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.portfolio">Portfolio</a>
        <a href="./articles.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.articles">Articles</a>
        <a href="./about.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.about">About</a>
        <a href="./index.html#contact" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.contact">Contact</a>
      </nav>
    </header>

    <main class="pt-28">
      <section class="w-full py-20 px-6 md:px-12 bg-black">
        <div class="max-w-4xl mx-auto">
          <a href="./portfolio.html" class="text-xs uppercase tracking-widest text-zinc-500 hover:text-white transition-colors" data-i18n="page.portfolioItem.back">
            ← Back to Portfolio
          </a>

          <div class="mt-10 flex items-start justify-between gap-6">
            <div>
              <h1 id="item-title" class="text-4xl md:text-7xl font-semibold tracking-tighter leading-[0.95]"></h1>
              <p id="item-summary" class="text-zinc-400 text-base md:text-lg font-light leading-relaxed mt-8"></p>
              <div id="item-tags" class="flex flex-wrap gap-2 mt-8"></div>
            </div>
            <div id="item-year" class="text-xs font-mono text-zinc-600"></div>
          </div>

          <div id="item-actions" class="flex flex-wrap gap-3 mt-10"></div>
          <div id="item-experience" class="mt-16"></div>
        </div>
      </section>
    </main>

    <script src="./data/local-content.js"></script>
    <script type="module">
      import { applyTranslations, escapeHtml, formatYear, getCurrentLanguage, getLocalizedValue, getQueryParam, loadJson, renderTags, setupGlobalControls, t } from "./site.js?v=20260812-1";

      const pageTranslations = {
        "page.portfolioItem.title": { en: "Portfolio Item", zh: "作品详情" },
        "page.portfolioItem.back": { en: "← Back to Portfolio", zh: "← 返回作品集" }
      };

      const id = getQueryParam("id");
      const titleEl = document.getElementById("item-title");
      const summaryEl = document.getElementById("item-summary");
      const tagsEl = document.getElementById("item-tags");
      const yearEl = document.getElementById("item-year");
      const actionsEl = document.getElementById("item-actions");
      const experienceEl = document.getElementById("item-experience");
      let itemCache = null;
      let activeIndex = 0;

      function setNotFound() {
        applyTranslations(pageTranslations);
        titleEl.textContent = t("common.portfolioNotFound", pageTranslations);
        summaryEl.textContent = t("common.invalidPortfolioId", pageTranslations);
        tagsEl.innerHTML = "";
        yearEl.textContent = "";
        actionsEl.innerHTML = "";
        experienceEl.innerHTML = "";
      }

      function renderActions(item) {
        const links = [];
        if (Array.isArray(item.externalLinks)) {
          item.externalLinks.forEach((link) => {
            if (link && link.url) {
              links.push({
                label: getCurrentLanguage() === "zh" && link.labelZh ? link.labelZh : link.label || t("common.link", pageTranslations),
                url: link.url,
              });
            }
          });
        }

        return links
          .map((link) => {
            const label = escapeHtml(link.label || t("common.link", pageTranslations));
            const url = escapeHtml(link.url || "#");
            return `<a href="${url}" target="_blank" rel="noreferrer" class="inline-flex items-center justify-center px-4 py-2 border border-white/10 hover:border-white/30 text-xs uppercase tracking-widest text-zinc-400 hover:text-white transition-colors">${label}</a>`;
          })
          .join("");
      }

      function renderBook(images) {
        const pages = images.map((src, index) => `<img ${index === 0 ? `src="${escapeHtml(src)}"` : `data-src="${escapeHtml(src)}"`} alt="Page ${index + 1}" draggable="false" />`).join("");
        return `
          <section class="portfolio-book" data-book tabindex="0" aria-label="Portfolio book">
            <div class="portfolio-book__stage">
              <div class="portfolio-book__pages" data-book-pages>${pages}</div>
              <button type="button" class="portfolio-book__turn portfolio-book__turn--prev" data-book-prev aria-label="Previous page"></button>
              <button type="button" class="portfolio-book__turn portfolio-book__turn--next" data-book-next aria-label="Next page"></button>
              <span class="portfolio-book__spine" aria-hidden="true"></span>
            </div>
            <div class="portfolio-book__footer">
              <button type="button" data-book-prev>← PREVIOUS</button>
              <span data-book-counter>01 / ${String(images.length).padStart(2, "0")}</span>
              <button type="button" data-book-next>NEXT →</button>
            </div>
          </section>`;
      }

      function renderPhotography(images) {
        const thumbs = images.map((src, index) => `
          <button type="button" class="photo-film__thumb${index === 0 ? " is-active" : ""}" data-photo-index="${index}" aria-label="View photograph ${index + 1}">
            <img src="${escapeHtml(src)}" alt="" />
            <span>${String(index + 1).padStart(2, "0")}</span>
          </button>`).join("");
        return `
          <section class="photo-film" data-photo-film tabindex="0">
            <div class="photo-film__stage">
              <img data-photo-main src="${escapeHtml(images[0])}" alt="" />
              <button type="button" class="photo-film__nav photo-film__nav--prev" data-photo-prev aria-label="Previous photograph">←</button>
              <button type="button" class="photo-film__nav photo-film__nav--next" data-photo-next aria-label="Next photograph">→</button>
              <span class="photo-film__count" data-photo-counter>01 / ${String(images.length).padStart(2, "0")}</span>
            </div>
            <div class="photo-film__strip">${thumbs}</div>
          </section>`;
      }

      function updateBook(nextIndex) {
        const images = itemCache.galleryImages || [];
        activeIndex = Math.max(0, Math.min(images.length - 1, nextIndex));
        const pages = experienceEl.querySelectorAll("[data-book-pages] img");
        const activePage = pages[activeIndex];
        if (activePage?.dataset.src && !activePage.src) activePage.src = activePage.dataset.src;
        const preloadPage = pages[activeIndex + 1];
        if (preloadPage?.dataset.src && !preloadPage.src) preloadPage.src = preloadPage.dataset.src;
        pages.forEach((page, index) => page.classList.toggle("is-active", index === activeIndex));
        const counter = experienceEl.querySelector("[data-book-counter]");
        if (counter) counter.textContent = `${String(activeIndex + 1).padStart(2, "0")} / ${String(images.length).padStart(2, "0")}`;
        experienceEl.querySelectorAll("[data-book-prev]").forEach((button) => button.disabled = activeIndex === 0);
        experienceEl.querySelectorAll("[data-book-next]").forEach((button) => button.disabled = activeIndex === images.length - 1);
      }

      function updatePhoto(nextIndex) {
        const images = itemCache.galleryImages || [];
        activeIndex = (nextIndex + images.length) % images.length;
        const main = experienceEl.querySelector("[data-photo-main]");
        main.classList.add("is-changing");
        window.setTimeout(() => {
          main.src = images[activeIndex];
          main.classList.remove("is-changing");
        }, 150);
        experienceEl.querySelectorAll("[data-photo-index]").forEach((button, index) => button.classList.toggle("is-active", index === activeIndex));
        experienceEl.querySelector("[data-photo-counter]").textContent = `${String(activeIndex + 1).padStart(2, "0")} / ${String(images.length).padStart(2, "0")}`;
      }

      function bindExperience() {
        const isBook = itemCache.tags?.includes("Portfolio Book") || Boolean(itemCache.pdf);
        const root = experienceEl.querySelector(isBook ? "[data-book]" : "[data-photo-film]");
        let pointerStartX = null;
        experienceEl.querySelectorAll(isBook ? "[data-book-prev]" : "[data-photo-prev]").forEach((button) => button.addEventListener("click", () => isBook ? updateBook(activeIndex - 1) : updatePhoto(activeIndex - 1)));
        experienceEl.querySelectorAll(isBook ? "[data-book-next]" : "[data-photo-next]").forEach((button) => button.addEventListener("click", () => isBook ? updateBook(activeIndex + 1) : updatePhoto(activeIndex + 1)));
        experienceEl.querySelectorAll("[data-photo-index]").forEach((button) => button.addEventListener("click", () => updatePhoto(Number(button.dataset.photoIndex))));
        root?.addEventListener("keydown", (event) => {
          if (event.key === "ArrowLeft") isBook ? updateBook(activeIndex - 1) : updatePhoto(activeIndex - 1);
          if (event.key === "ArrowRight") isBook ? updateBook(activeIndex + 1) : updatePhoto(activeIndex + 1);
        });
        root?.addEventListener("pointerdown", (event) => { pointerStartX = event.clientX; });
        root?.addEventListener("pointerup", (event) => {
          if (pointerStartX === null) return;
          const delta = event.clientX - pointerStartX;
          pointerStartX = null;
          if (Math.abs(delta) < 48) return;
          if (delta < 0) isBook ? updateBook(activeIndex + 1) : updatePhoto(activeIndex + 1);
          else isBook ? updateBook(activeIndex - 1) : updatePhoto(activeIndex - 1);
        });
        if (isBook) updateBook(0);
      }

      function renderPage() {
        if (!itemCache) return setNotFound();
        applyTranslations(pageTranslations);
        const title = getLocalizedValue(itemCache, "title");
        document.title = `${title} · ${t("page.portfolioItem.title", pageTranslations)}`;
        titleEl.textContent = title;
        summaryEl.textContent = getLocalizedValue(itemCache, "summary");
        tagsEl.innerHTML = renderTags(itemCache.tags || []);
        yearEl.textContent = formatYear(itemCache.year);
        actionsEl.innerHTML = renderActions(itemCache);
        activeIndex = 0;
        const images = itemCache.galleryImages || [];
        experienceEl.innerHTML = itemCache.tags?.includes("Portfolio Book") || itemCache.pdf ? renderBook(images) : renderPhotography(images);
        bindExperience();
      }

      async function init() {
        if (!id) return setNotFound();
        try {
          const items = await loadJson("./data/portfolio.json");
          itemCache = items.find((item) => item.id === id) || null;
          if (!itemCache) return setNotFound();
          renderPage();
        } catch {
          setNotFound();
        }
      }

      setupGlobalControls();
      init();
      window.addEventListener("site:language-change", renderPage);
    </script>
  </body>
</html>
