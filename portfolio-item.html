<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Item</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Playfair Display", "serif"],
            },
            colors: {
              "zinc-950": "#09090b",
            },
            animation: {
              "fade-in-up": "fadeInUp 0.8s ease-out forwards",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      ::selection {
        background-color: white;
        color: black;
      }
      body {
        background-color: #000;
        color: #fff;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="antialiased">
    <header
      class="fixed top-0 left-0 w-full z-50 px-6 py-6 md:px-12 md:py-8 flex justify-between items-center mix-blend-difference text-white"
    >
      <a
        href="./index.html"
        class="text-sm font-medium tracking-[0.2em] uppercase hover:opacity-70 transition-opacity"
      >
        Alan Wang
      </a>
      <nav class="hidden md:flex space-x-8 text-sm font-light tracking-wide">
        <a
          href="./projects.html"
          class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all"
        >
          Projects
        </a>
        <a
          href="./portfolio.html"
          class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all"
        >
          Portfolio
        </a>
        <a
          href="./articles.html"
          class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all"
        >
          Articles
        </a>
      </nav>
    </header>

    <main class="pt-28">
      <section class="w-full py-20 px-6 md:px-12 bg-black">
        <div class="max-w-4xl mx-auto">
          <a
            href="./portfolio.html"
            class="text-xs uppercase tracking-widest text-zinc-500 hover:text-white transition-colors"
          >
            ← Back to Portfolio
          </a>

          <div class="mt-10 flex items-start justify-between gap-6">
            <div>
              <h1 id="item-title" class="text-4xl md:text-7xl font-semibold tracking-tighter leading-[0.95]"></h1>
              <p id="item-summary" class="text-zinc-400 text-base md:text-lg font-light leading-relaxed mt-8"></p>
              <div id="item-tags" class="flex flex-wrap gap-2 mt-8"></div>
            </div>
            <div id="item-year" class="text-xs font-mono text-zinc-600"></div>
          </div>

          <div id="item-actions" class="flex flex-wrap gap-3 mt-10"></div>

          <div class="mt-16 border-t border-white/10 pt-12">
            <div id="item-pdf" class="mb-12"></div>
            <div id="item-gallery" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
          </div>
        </div>
      </section>
    </main>

    <script type="module">
      import { loadJson, getQueryParam, escapeHtml, renderTags, formatYear } from "./site.js";

      const id = getQueryParam("id");

      const titleEl = document.getElementById("item-title");
      const summaryEl = document.getElementById("item-summary");
      const tagsEl = document.getElementById("item-tags");
      const yearEl = document.getElementById("item-year");
      const actionsEl = document.getElementById("item-actions");
      const pdfEl = document.getElementById("item-pdf");
      const galleryEl = document.getElementById("item-gallery");

      function setNotFound() {
        titleEl.textContent = "Portfolio Item Not Found";
        summaryEl.textContent = "Missing or invalid id.";
      }

      function renderActions(item) {
        const links = [];

        if (item.pdf) {
          links.push({
            label: "Download PDF",
            url: item.pdf,
          });
        }

        if (Array.isArray(item.externalLinks)) {
          item.externalLinks.forEach((l) => {
            if (l && l.url) links.push({ label: l.label || "Link", url: l.url });
          });
        }

        return links
          .map((l) => {
            const label = escapeHtml(l.label || "Link");
            const url = escapeHtml(l.url || "#");
            return `<a href="${url}" target="_blank" rel="noreferrer" class="inline-flex items-center justify-center px-4 py-2 border border-white/10 hover:border-white/30 text-xs uppercase tracking-widest text-zinc-400 hover:text-white transition-colors">${label}</a>`;
          })
          .join("");
      }

      function renderPdf(item) {
        if (!item.pdf) return `<div class="text-zinc-600 text-sm">No PDF attached.</div>`;
        const url = escapeHtml(item.pdf);
        return `
          <div class="border border-white/10 overflow-hidden">
            <iframe title="PDF Preview" src="${url}" class="w-full h-[720px] bg-black"></iframe>
          </div>
        `;
      }

      function renderGallery(images) {
        if (!Array.isArray(images) || images.length === 0) return "";
        return images
          .map((src) => {
            const url = escapeHtml(src);
            return `<a href="${url}" target="_blank" rel="noreferrer" class="block border border-white/10 hover:border-white/25 transition-colors overflow-hidden"><img src="${url}" alt="" class="w-full h-auto" /></a>`;
          })
          .join("");
      }

      async function init() {
        if (!id) return setNotFound();
        try {
          const items = await loadJson("./data/portfolio.json");
          const item = items.find((x) => x.id === id);
          if (!item) return setNotFound();

          document.title = `${item.title} · Portfolio`;
          titleEl.textContent = item.title || "";
          summaryEl.textContent = item.summary || "";
          tagsEl.innerHTML = renderTags(item.tags || []);
          yearEl.textContent = formatYear(item.year);
          actionsEl.innerHTML = renderActions(item);
          pdfEl.innerHTML = renderPdf(item);
          galleryEl.innerHTML = renderGallery(item.galleryImages || []);
        } catch (e) {
          setNotFound();
        }
      }

      init();
    </script>
  </body>
</html>
