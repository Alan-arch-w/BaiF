<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-title-key="page.project.title">Project</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("site-theme") || "dark";
          const lang = localStorage.getItem("site-language") || "en";
          document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.lang = "en";
        }
      })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./site.css" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Playfair Display", "serif"],
            },
            colors: {
              "zinc-950": "#09090b",
            },
            animation: {
              "fade-in-up": "fadeInUp 0.8s ease-out forwards",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      .glass-panel {
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
    </style>
  </head>
  <body class="antialiased">
    <header class="site-header fixed top-0 left-0 w-full z-50 px-6 py-6 md:px-12 md:py-8 flex justify-between items-center mix-blend-difference text-white">
      <a href="./index.html" class="text-sm font-medium tracking-[0.2em] uppercase hover:opacity-70 transition-opacity" data-i18n="brand.name">Alan Wang</a>
      <nav class="hidden md:flex space-x-8 text-sm font-light tracking-wide">
        <a href="./projects.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.projects">Projects</a>
        <a href="./portfolio.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.portfolio">Portfolio</a>
        <a href="./articles.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.articles">Articles</a>
      </nav>
    </header>

    <main class="pt-28">
      <section class="w-full py-20 px-6 md:px-12 bg-black">
        <div class="max-w-4xl mx-auto">
          <div class="flex items-center justify-between gap-6">
            <a href="./projects.html" class="text-xs uppercase tracking-widest text-zinc-500 hover:text-white transition-colors" data-i18n="page.project.back">
              ← Back to Projects
            </a>
            <div class="text-xs uppercase tracking-widest text-zinc-700" id="project-meta"></div>
          </div>

          <h1 id="project-title" class="text-4xl md:text-7xl font-semibold tracking-tighter leading-[0.95] mt-10"></h1>
          <p id="project-intro" class="text-zinc-400 text-base md:text-lg font-light leading-relaxed mt-8"></p>
          <div id="project-tags" class="flex flex-wrap gap-2 mt-8"></div>
          <div id="project-links" class="flex flex-wrap gap-3 mt-10"></div>
          <div class="mt-16 border-t border-white/10 pt-12" id="project-sections"></div>
        </div>
      </section>
    </main>

    <script type="module">
      import { applyTranslations, escapeHtml, formatYear, getCurrentLanguage, getLocalizedValue, getQueryParam, loadJson, renderTags, setupGlobalControls, t } from "./site.js";

      const pageTranslations = {
        "page.project.title": { en: "Project", zh: "项目详情" },
        "page.project.back": { en: "← Back to Projects", zh: "← 返回项目列表" }
      };

      const id = getQueryParam("id");
      const titleEl = document.getElementById("project-title");
      const introEl = document.getElementById("project-intro");
      const tagsEl = document.getElementById("project-tags");
      const linksEl = document.getElementById("project-links");
      const sectionsEl = document.getElementById("project-sections");
      const metaEl = document.getElementById("project-meta");
      let projectCache = null;

      function setNotFound() {
        applyTranslations(pageTranslations);
        titleEl.textContent = t("common.projectNotFound", pageTranslations);
        introEl.textContent = t("common.invalidProjectId", pageTranslations);
        metaEl.textContent = "";
        tagsEl.innerHTML = "";
        linksEl.innerHTML = "";
        sectionsEl.innerHTML = "";
      }

      function renderLinks(links) {
        if (!Array.isArray(links) || links.length === 0) return "";
        return links
          .map((link) => {
            const label = escapeHtml(getCurrentLanguage() === "zh" && link.labelZh ? link.labelZh : link.label || t("common.link", pageTranslations));
            const url = escapeHtml(link.url || "#");
            return `<a href="${url}" target="_blank" rel="noreferrer" class="inline-flex items-center justify-center px-4 py-2 border border-white/10 hover:border-white/30 text-xs uppercase tracking-widest text-zinc-400 hover:text-white transition-colors">${label}</a>`;
          })
          .join("");
      }

      function renderSections(sections) {
        if (!Array.isArray(sections) || sections.length === 0) return "";
        return sections
          .map((section) => {
            const heading = escapeHtml(getCurrentLanguage() === "zh" && section.titleZh ? section.titleZh : section.title || "");
            const content = escapeHtml(getCurrentLanguage() === "zh" && section.contentZh ? section.contentZh : section.content || "");
            return `
              <section class="mb-12">
                <h2 class="text-xs font-bold tracking-[0.2em] uppercase mb-6 text-zinc-600">${heading}</h2>
                <p class="text-zinc-300/90 text-base leading-relaxed font-light whitespace-pre-line">${content}</p>
              </section>
            `;
          })
          .join("");
      }

      function renderPage() {
        if (!projectCache) return setNotFound();
        applyTranslations(pageTranslations);
        const title = getLocalizedValue(projectCache, "title");
        document.title = `${title} · ${t("page.project.title", pageTranslations)}`;
        titleEl.textContent = title;
        introEl.textContent = getLocalizedValue(projectCache, "intro") || getLocalizedValue(projectCache, "summary");
        metaEl.textContent = [getLocalizedValue(projectCache, "category"), formatYear(projectCache.year)].filter(Boolean).join(" · ");
        tagsEl.innerHTML = renderTags(projectCache.tags || []);
        linksEl.innerHTML = renderLinks(projectCache.links || []);
        sectionsEl.innerHTML = renderSections(projectCache.contentSections || []);
      }

      async function init() {
        if (!id) return setNotFound();
        try {
          const projects = await loadJson("./data/projects.json");
          projectCache = projects.find((project) => project.id === id) || null;
          if (!projectCache) return setNotFound();
          renderPage();
        } catch {
          setNotFound();
        }
      }

      setupGlobalControls();
      init();
      window.addEventListener("site:language-change", renderPage);
    </script>
  </body>
</html>
