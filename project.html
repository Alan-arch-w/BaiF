<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-title-key="page.project.title">Project</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("site-theme") || "dark";
          const lang = localStorage.getItem("site-language") || "en";
          document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.lang = "en";
        }
      })();
    </script>
    <script src="./assets/vendor/tailwindcss.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./site.css?v=20260914-3" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "sans-serif"], serif: ["Playfair Display", "serif"] },
            colors: { "zinc-950": "#09090b" },
            animation: { "fade-in-up": "fadeInUp 0.8s ease-out forwards" },
            keyframes: { fadeInUp: { "0%": { opacity: "0", transform: "translateY(20px)" }, "100%": { opacity: "1", transform: "translateY(0)" } } }
          }
        }
      };
    </script>
  </head>
  <body class="antialiased project-page">
    <header class="site-header fixed top-0 left-0 w-full z-50 px-6 py-6 md:px-12 md:py-8 flex justify-between items-center mix-blend-difference text-white">
      <a href="./index.html" class="site-brand" aria-label="BaiF Home">
        <svg class="site-brand__mark" viewBox="0 0 44 44" aria-hidden="true"><path d="M9 7.5c7.5-1 18.8-1 26 0 1.8.3 2.8 1.4 3 3.1.8 7.7.8 15.2 0 22.8-.2 1.7-1.2 2.8-3 3.1-7.4 1-18.6 1-26 0-1.8-.3-2.8-1.4-3-3.1-.8-7.6-.8-15.1 0-22.8.2-1.7 1.2-2.8 3-3.1Z"/><circle cx="18.2" cy="22" r="1.15" fill="currentColor" stroke="none"/><circle cx="25.8" cy="22" r="1.15" fill="currentColor" stroke="none"/></svg>
        <span class="site-brand__wordmark">BaiF</span>
      </a>
      <nav class="hidden md:flex space-x-8 text-sm font-light tracking-wide">
        <a href="./projects.html" data-i18n="nav.projects">Projects</a>
        <a href="./portfolio.html?view=photography" data-i18n="nav.photography">Photography</a>
        <a href="./portfolio.html?view=portfolio" data-i18n="nav.portfolio">Portfolio</a>
        <a href="./articles.html" data-i18n="nav.articles">Articles</a>
        <a href="./about.html" data-i18n="nav.about">About</a>
        <a href="./index.html#contact" data-i18n="nav.contact">Contact</a>
      </nav>
    </header>

    <main class="pt-28">
      <section id="project-hero" class="project-detail w-full py-20 px-6 md:px-12 bg-cover bg-center">
        <div class="max-w-4xl mx-auto">
          <div class="flex items-center justify-between gap-6">
            <a href="./projects.html" class="project-back text-xs uppercase tracking-widest" data-i18n="page.project.back">← Back to Projects</a>
            <div class="project-meta text-xs uppercase tracking-widest" id="project-meta"></div>
          </div>
          <h1 id="project-title" class="text-4xl md:text-7xl font-semibold tracking-tighter leading-[0.95] mt-10"></h1>
          <p id="project-intro" class="project-intro text-base md:text-lg font-light leading-relaxed mt-8"></p>
          <div id="project-tags" class="flex flex-wrap gap-2 mt-8"></div>
          <div id="project-cover" class="mt-12"></div>
          <div id="project-gallery" class="project-gallery mt-10 grid grid-cols-1 sm:grid-cols-3 gap-6 items-start"></div>
          <div id="project-video" class="mt-10"></div>
          <div id="project-links" class="project-actions flex flex-wrap gap-3 mt-10"></div>
          <div class="project-sections mt-16 border-t pt-12" id="project-sections"></div>
        </div>
      </section>
    </main>

    <script src="./data/local-content.js"></script>
    <script type="module">
      import { applyTranslations, escapeHtml, formatYear, getCurrentLanguage, getLocalizedValue, getQueryParam, loadJson, renderTags, setupGlobalControls, t } from "./site.js?v=20260914-2";

      const pageTranslations = {
        "page.project.title": { en: "Project", zh: "项目详情" },
        "page.project.back": { en: "← Back to Projects", zh: "← 返回项目列表" },
        "page.project.openWebsite": { en: "Open Website", zh: "打开网站" },
        "page.project.viewSource": { en: "View Source", zh: "查看源码" }
      };

      const id = getQueryParam("id");
      const titleEl = document.getElementById("project-title");
      const heroEl = document.getElementById("project-hero");
      const introEl = document.getElementById("project-intro");
      const tagsEl = document.getElementById("project-tags");
      const coverEl = document.getElementById("project-cover");
      const galleryEl = document.getElementById("project-gallery");
      const videoEl = document.getElementById("project-video");
      const linksEl = document.getElementById("project-links");
      const sectionsEl = document.getElementById("project-sections");
      const metaEl = document.getElementById("project-meta");
      let projectCache = null;

      function setNotFound() {
        applyTranslations(pageTranslations);
        titleEl.textContent = t("common.projectNotFound", pageTranslations);
        introEl.textContent = t("common.invalidProjectId", pageTranslations);
        metaEl.textContent = "";
        tagsEl.innerHTML = coverEl.innerHTML = galleryEl.innerHTML = videoEl.innerHTML = linksEl.innerHTML = sectionsEl.innerHTML = "";
      }

      function linkKind(link) {
        if (link.type === "demo" || link.type === "website") return "demo";
        if (link.type === "github" || /github\.com/i.test(link.url || "")) return "github";
        if (/open website/i.test(link.label || "")) return "demo";
        if (/view source/i.test(link.label || "")) return "github";
        return "";
      }

      function renderLinks(links) {
        if (!Array.isArray(links)) return "";
        const seen = new Set();
        return links.map((link) => ({ link, kind: linkKind(link) }))
          .filter(({ link, kind }) => kind && link.url && !seen.has(kind) && seen.add(kind))
          .map(({ link, kind }) => {
            const label = kind === "demo" ? t("page.project.openWebsite", pageTranslations) : t("page.project.viewSource", pageTranslations);
            return `<a href="${escapeHtml(link.url)}" target="_blank" rel="noreferrer" data-action="${kind}">${escapeHtml(label)}</a>`;
          }).join("");
      }

      function renderSections(sections) {
        if (!Array.isArray(sections) || sections.length === 0) return "";
        return sections.map((section) => {
          const heading = escapeHtml(getCurrentLanguage() === "zh" && section.titleZh ? section.titleZh : section.title || "");
          const content = escapeHtml(getCurrentLanguage() === "zh" && section.contentZh ? section.contentZh : section.content || "");
          return `<section class="mb-12"><h2 class="text-xs font-bold tracking-[0.2em] uppercase mb-6">${heading}</h2><p class="text-base leading-relaxed font-light whitespace-pre-line">${content}</p></section>`;
        }).join("");
      }

      function renderGallery(images, title, coverImage) {
        if (!Array.isArray(images)) return "";
        const cover = String(coverImage || "").replace(/^\.\//, "");
        const unique = [...new Set(images.filter(Boolean))].filter((image) => String(image).replace(/^\.\//, "") !== cover);
        return unique.map((image, index) => `<figure><img src="${escapeHtml(image)}" alt="${escapeHtml(title)} screenshot ${index + 1}" loading="lazy" /></figure>`).join("");
      }

      function renderVideo(video, title, poster) {
        if (!video) return "";
        const source = typeof video === "string" ? video : video.url;
        if (!source) return "";
        const label = typeof video === "object" ? (getCurrentLanguage() === "zh" && video.labelZh ? video.labelZh : video.label) : "Project demonstration";
        const posterAttr = poster ? ` poster="${escapeHtml(poster)}"` : "";
        return `<figure class="project-video"><video controls preload="metadata"${posterAttr}><source src="${escapeHtml(source)}" type="video/mp4" /></video><figcaption>${escapeHtml(label || title)}</figcaption></figure>`;
      }

      function renderPage() {
        if (!projectCache) return setNotFound();
        applyTranslations(pageTranslations);
        const title = getLocalizedValue(projectCache, "title");
        document.title = `${title} · ${t("page.project.title", pageTranslations)}`;
        titleEl.textContent = title;
        heroEl.style.backgroundImage = projectCache.coverImage
          ? `linear-gradient(180deg, color-mix(in srgb, var(--site-bg) 82%, transparent), color-mix(in srgb, var(--site-bg) 97%, transparent) 52%, var(--site-bg) 100%), url("${projectCache.coverImage.replaceAll('"', '%22')}")`
          : "";
        introEl.textContent = getLocalizedValue(projectCache, "intro") || getLocalizedValue(projectCache, "summary");
        metaEl.textContent = [getLocalizedValue(projectCache, "category"), formatYear(projectCache.year)].filter(Boolean).join(" · ");
        tagsEl.innerHTML = renderTags(projectCache.tags || []);
        coverEl.innerHTML = projectCache.coverImage ? `<figure class="project-cover"><img src="${escapeHtml(projectCache.coverImage)}" alt="${escapeHtml(title)}" /></figure>` : "";
        galleryEl.innerHTML = renderGallery(projectCache.galleryImages, title, projectCache.coverImage);
        videoEl.innerHTML = renderVideo(projectCache.video, title, projectCache.coverImage);
        linksEl.innerHTML = renderLinks(projectCache.links || []);
        sectionsEl.innerHTML = renderSections(projectCache.contentSections || []);
      }

      async function init() {
        if (!id) return setNotFound();
        try {
          const projects = await loadJson("./data/projects.json");
          projectCache = projects.find((project) => project.id === id) || null;
          renderPage();
        } catch { setNotFound(); }
      }

      setupGlobalControls();
      init();
      window.addEventListener("site:language-change", renderPage);
      window.addEventListener("site:theme-change", renderPage);
    </script>
  </body>
</html>
