<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Playfair Display", "serif"],
            },
            colors: {
              "zinc-950": "#09090b",
            },
            animation: {
              "fade-in-up": "fadeInUp 0.8s ease-out forwards",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
    <style>
      ::selection {
        background-color: white;
        color: black;
      }
      body {
        background-color: #000;
        color: #fff;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="antialiased">
    <header
      class="fixed top-0 left-0 w-full z-50 px-6 py-6 md:px-12 md:py-8 flex justify-between items-center mix-blend-difference text-white"
    >
      <a
        href="./index.html"
        class="text-sm font-medium tracking-[0.2em] uppercase hover:opacity-70 transition-opacity"
      >
        Alan Wang
      </a>
      <nav class="hidden md:flex space-x-8 text-sm font-light tracking-wide">
        <a
          href="./projects.html"
          class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all"
        >
          Projects
        </a>
        <a
          href="./portfolio.html"
          class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all"
        >
          Portfolio
        </a>
        <a
          href="./articles.html"
          class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all"
        >
          Articles
        </a>
      </nav>
    </header>

    <main class="pt-28">
      <section class="w-full py-20 px-6 md:px-12 bg-black">
        <div class="max-w-screen-xl mx-auto">
          <div class="flex items-end justify-between gap-8 mb-14">
            <div>
              <h1 class="text-4xl md:text-6xl font-semibold tracking-tighter leading-none">
                Projects
              </h1>
              <p class="text-zinc-500 text-sm md:text-base tracking-wide mt-4 max-w-xl">
                Data-driven list from <span class="font-mono">data/projects.json</span>.
              </p>
            </div>
            <a
              href="./index.html#contact"
              class="text-xs uppercase tracking-widest text-zinc-500 hover:text-white transition-colors"
            >
              Contact
            </a>
          </div>

          <div id="projects-list" class="flex flex-col"></div>
        </div>
      </section>
    </main>

    <script type="module">
      import { loadJson, formatYear, escapeHtml } from "./site.js";

      const listEl = document.getElementById("projects-list");

      function renderItem(p, index) {
        const num = String(index + 1).padStart(2, "0");
        const year = formatYear(p.year);
        const category = p.category ? escapeHtml(p.category) : "";
        const title = escapeHtml(p.title);
        const summary = escapeHtml(p.summary);

        return `
          <a href="./project.html?id=${encodeURIComponent(
            p.id
          )}" class="group relative flex flex-col md:flex-row md:items-baseline py-12 border-b border-white/10 transition-colors hover:bg-white/5">
            <span class="text-sm text-zinc-600 w-24 mb-2 md:mb-0 font-mono">${num}</span>
            <div class="flex-1">
              <h3 class="text-3xl md:text-5xl font-medium tracking-tight mb-2 group-hover:translate-x-2 transition-transform duration-500">${title}</h3>
              <p class="text-zinc-400 text-sm md:text-base max-w-md font-light">${summary}</p>
            </div>
            <div class="text-right mt-4 md:mt-0">
              <span class="text-xs uppercase tracking-wider text-zinc-500 mr-8">${category}</span>
              <span class="text-xs font-mono text-zinc-600">${escapeHtml(year)}</span>
            </div>
          </a>
        `;
      }

      async function init() {
        try {
          const projects = await loadJson("./data/projects.json");
          listEl.innerHTML = projects.map(renderItem).join("");
        } catch (e) {
          listEl.innerHTML = `<div class="text-zinc-500 text-sm">Failed to load projects.</div>`;
        }
      }

      init();
    </script>
  </body>
</html>
