<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-title-key="page.projects.title">Projects</title>
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("site-theme") || "dark";
          const lang = localStorage.getItem("site-language") || "en";
          document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
          document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        } catch {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.lang = "en";
        }
      })();
    </script>
    <script src="./assets/vendor/tailwindcss.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./site.css?v=20260813-1" />
    <script src="./site-cursor.js?v=20260812-1" defer></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              serif: ["Playfair Display", "serif"],
            },
            colors: {
              "zinc-950": "#09090b",
            },
            animation: {
              "fade-in-up": "fadeInUp 0.8s ease-out forwards",
            },
            keyframes: {
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="antialiased">
    <header class="site-header fixed top-0 left-0 w-full z-50 px-6 py-6 md:px-12 md:py-8 flex justify-between items-center mix-blend-difference text-white">
      <a href="./index.html" class="site-brand" aria-label="Alan Wang — Home">
        <svg class="site-brand__mark" viewBox="0 0 44 44" aria-hidden="true"><path d="M22 3 38.5 12.5v19L22 41 5.5 31.5v-19L22 3Z"/><path d="m5.5 12.5 16.5 9.5 16.5-9.5M22 22v19"/><path d="m13.8 29.2 8.2-14.3 8.2 14.3M17.4 23h9.2"/></svg>
        <span class="site-brand__wordmark">ALAN WANG</span>
      </a>
      <nav class="hidden md:flex space-x-8 text-sm font-light tracking-wide">
        <a href="./projects.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.projects">Projects</a>
        <a href="./portfolio.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.portfolio">Portfolio</a>
        <a href="./articles.html" class="hover:underline underline-offset-4 decoration-1 decoration-white/50 transition-all" data-i18n="nav.articles">Articles</a>
      </nav>
    </header>

    <main class="pt-28">
      <section class="w-full py-20 px-6 md:px-12 bg-black">
        <div class="max-w-screen-xl mx-auto">
          <div class="flex items-end justify-between gap-8 mb-14">
            <div>
              <h1 class="text-4xl md:text-6xl font-semibold tracking-tighter leading-none" data-i18n="page.projects.heading">Projects</h1>
              <p class="text-zinc-500 text-sm md:text-base tracking-wide mt-4 max-w-xl" data-i18n-html="page.projects.subtitle">
                Data-driven list from <span class="font-mono">data/projects.json</span>.
              </p>
            </div>
            <a href="./index.html#contact" class="text-xs uppercase tracking-widest text-zinc-500 hover:text-white transition-colors" data-i18n="nav.contact">Contact</a>
          </div>

          <div id="projects-list" class="flex flex-col"></div>
        </div>
      </section>
    </main>

    <script src="./data/local-content.js"></script>
    <script type="module">
      import {
        applyTranslations,
        escapeHtml,
        formatYear,
        getLocalizedValue,
        loadJson,
        setupGlobalControls,
        syncPreviewLinks,
        t,
        withPreviewParams,
      } from "./site.js?v=20260812-1";

      const pageTranslations = {
        "page.projects.title": { en: "Projects", zh: "项目" },
        "page.projects.heading": { en: "Projects", zh: "项目" },
        "page.projects.subtitle": { en: "Data-driven list from <span class='font-mono'>data/projects.json</span>.", zh: "这里展示的是来自 <span class='font-mono'>data/projects.json</span> 的项目列表。" }
      };

      const listEl = document.getElementById("projects-list");
      let projectsCache = [];

      function renderItem(project, index) {
        const num = String(index + 1).padStart(2, "0");
        const year = formatYear(project.year);
        const category = escapeHtml(getLocalizedValue(project, "category"));
        const title = escapeHtml(getLocalizedValue(project, "title"));
        const summary = escapeHtml(getLocalizedValue(project, "summary"));
        const cover = project.coverImage ? escapeHtml(project.coverImage) : "";

        return `
          <a href="${withPreviewParams(`./project.html?id=${encodeURIComponent(project.id)}`)}" class="group relative grid grid-cols-1 md:grid-cols-[4rem_minmax(0,1fr)_minmax(12rem,22rem)] gap-6 md:gap-8 items-center py-10 border-b border-white/10 transition-colors hover:bg-white/[0.03]">
            <span class="text-sm text-zinc-600 w-24 mb-2 md:mb-0 font-mono">${num}</span>
            <div>
              <h3 class="text-3xl md:text-5xl font-medium tracking-tight mb-2 group-hover:translate-x-2 transition-transform duration-500">${title}</h3>
              <p class="text-zinc-400 text-sm md:text-base max-w-md font-light">${summary}</p>
              <div class="mt-5">
                <span class="text-xs uppercase tracking-wider text-zinc-500 mr-8">${category}</span>
                <span class="text-xs font-mono text-zinc-600">${escapeHtml(year)}</span>
              </div>
            </div>
            ${cover
              ? `<div class="relative aspect-[16/9] overflow-hidden border border-white/10 bg-white/[0.02]"><img src="${cover}" alt="" class="absolute inset-0 h-full w-full object-cover object-top opacity-80 transition duration-700 group-hover:scale-[1.025] group-hover:opacity-100" /></div>`
              : `<div class="hidden md:block aspect-[16/9] border border-white/10 bg-white/[0.02]"></div>`}
          </a>
        `;
      }

      function renderPage() {
        applyTranslations(pageTranslations);
        listEl.innerHTML = projectsCache.map(renderItem).join("");
        syncPreviewLinks(listEl);
      }

      async function init() {
        try {
          projectsCache = await loadJson("./data/projects.json");
          renderPage();
        } catch {
          listEl.innerHTML = `<div class="text-zinc-500 text-sm">${t("common.failedProjects", pageTranslations)}</div>`;
        }
      }

      setupGlobalControls();
      init();
      window.addEventListener("site:language-change", renderPage);
    </script>
  </body>
</html>
